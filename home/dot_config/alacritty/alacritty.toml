[cursor.style]
blinking = "On"
shape = "Beam"

[font]
size = 13.0

[font.normal]
family = "CaskaydiaCove Nerd Font"
style = "Medium"

[font.bold]
family = "CaskaydiaCove Nerd Font"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font"
style = "Italic"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font"
style = "Bold Italic"

[terminal.shell]
program = "/bin/zsh"

[window]
decorations = "none"
decorations_theme_variant = "Dark"
dynamic_title = true
opacity = 0.9
blur = true
title = "Alacritty"

[colors]
transparent_background_colors = true

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
  {key = "|", mods = "Control", chars = "\\x01\\x7c"}
]

[general]
live_config_reload = true
import = ["/home/jeff/.config/alacritty/themes/ayu_dark.toml"]

[terminal]
