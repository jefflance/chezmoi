import = ["/home/jeff/.config/alacritty/onedarkpro.toml"]
live_config_reload = true

[cursor.style]
blinking = "On"
shape = "Beam"

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font Medium"
style = "Medium"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[shell]
program = "/bin/zsh"

[window]
decorations = "full"
decorations_theme_variant = "Dark"
dynamic_title = true
opacity = 0.9
title = "Alacritty"

[keyboard]
bindings = [
  {key = "|", mods = "Control", chars = "\\x01\\x7c"}
]
