#  ─────────────────────────────────────────────────────────────────────────────
# key bindings
# ─────────────────────────────────────────────────────────────────────────────
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
#
# ── Modifier philosophy ──────────────────────────────────────────────────────
#  SUPER          → window/tag/monitor focus navigation
#  SUPER+SHIFT    → move/send (swap window, send to tag/monitor)
#  SUPER+CTRL     → WM system (reload, quit, layout)
#  ALT            → spawn (terminal, launcher)
#  CTRL+SHIFT     → move floating window
#  CTRL+ALT       → resize floating window
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# wm system
# ─────────────────────────────────────────────────────────────────────────────
bind=SUPER+CTRL,r,reload_config
bind=SUPER+CTRL,h,spawn,noctalia msg keybind-cheatsheet toggle
bind=SUPER+CTRL,q,spawn,noctalia msg panel-toggle session
bind=SUPER+CTRL,l,switch_layout
bind=SUPER+CTRL+SHIFT,r,spawn,noctalia msg config-reload
bind=SUPER+CTRL+SHIFT,l,switch_keyboard_layout

# ─────────────────────────────────────────────────────────────────────────────
# spawn
# ─────────────────────────────────────────────────────────────────────────────
bind=SUPER,Return,spawn,kitty
bind=SUPER,space,spawn,sh -c $HOME/.config/rofi/launchers/type-3/launcher.sh
bind=SUPER,e,spawn,thunar
# bind=SUPER,p,spawn,noctalia msg plugin:launcher-pass toggle
bind=NONE,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh region
bind=SHIFT,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh fullscreen
bind=SUPER,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh window
bind=SUPER+SHIFT,Print,spawn,$HOME/.config/mango/scripts/screenshot.sh annotate

# ─────────────────────────────────────────────────────────────────────────────
# scratchpad
# ─────────────────────────────────────────────────────────────────────────────
bind=SUPER,j,toggle_named_scratchpad,none,Joplin,joplin-desktop
bind=SUPER,s,toggle_scratchpad

# ─────────────────────────────────────────────────────────────────────────────
# window focus
# ─────────────────────────────────────────────────────────────────────────────
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ─────────────────────────────────────────────────────────────────────────────
# window swap
# ─────────────────────────────────────────────────────────────────────────────
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# ─────────────────────────────────────────────────────────────────────────────
# window state
# ─────────────────────────────────────────────────────────────────────────────
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,f,togglefloating,
# bind=SUPER,s,minimized
# bind=SUPER+SHIFT,s,restore_minimized,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER+SHIFT,o,toggleoverlay,
bind=SUPER+SHIFT,g,toggleglobal,

# ─────────────────────────────────────────────────────────────────────────────
# overview
# ─────────────────────────────────────────────────────────────────────────────
bind=ALT,Tab,toggleoverview,

# ─────────────────────────────────────────────────────────────────────────────
# scroller layout
# ─────────────────────────────────────────────────────────────────────────────
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# ─────────────────────────────────────────────────────────────────────────────
# tag navigation
# ─────────────────────────────────────────────────────────────────────────────
bind=SUPER,Prior,viewtoleft,0
bind=SUPER,Next,viewtoright,0
bind=SUPER+SHIFT,Prior,tagtoleft,0
bind=SUPER+SHIFT,Next,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# ─────────────────────────────────────────────────────────────────────────────
# monitor  (, = left  . = right)
# ─────────────────────────────────────────────────────────────────────────────
bind=SUPER,Home,focusmon,left
bind=SUPER,End,focusmon,right
bind=SUPER+SHIFT,Home,tagmon,left
bind=SUPER+SHIFT,End,tagmon,right

# ─────────────────────────────────────────────────────────────────────────────
# gaps
# ─────────────────────────────────────────────────────────────────────────────
bind=ALT+SHIFT,equal,incgaps,1
bind=ALT+SHIFT,minus,incgaps,-1
bind=ALT+SHIFT,r,togglegaps

# ─────────────────────────────────────────────────────────────────────────────
# movewin / resizewin (floating)
# ─────────────────────────────────────────────────────────────────────────────
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# ─────────────────────────────────────────────────────────────────────────────
# mouse
# ─────────────────────────────────────────────────────────────────────────────
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# ─────────────────────────────────────────────────────────────────────────────
# axis
# ─────────────────────────────────────────────────────────────────────────────
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ─────────────────────────────────────────────────────────────────────────────
# multimedia
# ─────────────────────────────────────────────────────────────────────────────
# volume
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=SHIFT,XF86AudioRaiseVolume,spawn,noctalia msg mic-volume-up
bind=SHIFT,XF86AudioLowerVolume,spawn,noctalia msg mic-volume-down
bind=SHIFT,XF86AudioMute,spawn,noctalia msg mic-mute

# playback
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=SHIFT,XF86AudioNext,spawn,noctalia msg media next-player
bind=SHIFT,XF86AudioPrev,spawn,noctalia msg media previous-player
bind=SHIFT,XF86AudioPlay,spawn,noctalia msg media stop

# ─────────────────────────────────────────────────────────────────────────────
# interface
# ─────────────────────────────────────────────────────────────────────────────
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
