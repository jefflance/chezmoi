# ─────────────────────────────────────────────────────────────────────────────
# main configuration
# ─────────────────────────────────────────────────────────────────────────────
# more options: https://github.com/DreamMaoMao/mango/wiki/

# ─────────────────────────────────────────────────────────────────────────────
# window blur
# ─────────────────────────────────────────────────────────────────────────────
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

# ─────────────────────────────────────────────────────────────────────────────
# window shadows
# ─────────────────────────────────────────────────────────────────────────────
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadowscolor=0x000000ff

# ─────────────────────────────────────────────────────────────────────────────
# window appearance
# ─────────────────────────────────────────────────────────────────────────────
border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# ─────────────────────────────────────────────────────────────────────────────
# animations
# ─────────────────────────────────────────────────────────────────────────────
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# ─────────────────────────────────────────────────────────────────────────────
# scroller layout
# ─────────────────────────────────────────────────────────────────────────────
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# ─────────────────────────────────────────────────────────────────────────────
# master-stack layout
# ─────────────────────────────────────────────────────────────────────────────
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# ─────────────────────────────────────────────────────────────────────────────
# overview
# ─────────────────────────────────────────────────────────────────────────────
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# ─────────────────────────────────────────────────────────────────────────────
# misc
# ─────────────────────────────────────────────────────────────────────────────
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# ─────────────────────────────────────────────────────────────────────────────
# keyboard
# ─────────────────────────────────────────────────────────────────────────────
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=fr,gb
xkb_rules_variant=ergol,customIntl

# ─────────────────────────────────────────────────────────────────────────────
# trackpad
# ─────────────────────────────────────────────────────────────────────────────
# need relogin to apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# ─────────────────────────────────────────────────────────────────────────────
# mouse
# ─────────────────────────────────────────────────────────────────────────────
# need relogin to apply
mouse_natural_scrolling=0

# ─────────────────────────────────────────────────────────────────────────────
# appearance
# ─────────────────────────────────────────────────────────────────────────────
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4

# ─────────────────────────────────────────────────────────────────────────────
# sub config files
# ─────────────────────────────────────────────────────────────────────────────
source=./env.conf
source=./bind.conf
source=./rule.conf

# ─────────────────────────────────────────────────────────────────────────────
# autostart desktop shell
# ─────────────────────────────────────────────────────────────────────────────
exec-once=noctalia

# ─────────────────────────────────────────────────────────────────────────────
# This sources the noctalia theme
# ─────────────────────────────────────────────────────────────────────────────
source=~/.config/mango/noctalia.conf

# ─────────────────────────────────────────────────────────────────────────────
# autostart other apps
# ─────────────────────────────────────────────────────────────────────────────
exec-once=~/.config/mango/autostart.sh

# This sources the noctalia theme

source = /home/jeff/.config/mango/noctalia.conf

