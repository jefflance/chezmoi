# ~/.config/starship.toml

format = """
$username\
${custom.hostname-pretty}\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$docker_context\
$package\
$container\
$nodejs\
$ocaml\
$php\
$python\
$ruby\
$rust\
$nix_shell\
$conda\
$memory_usage\
$env_var\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
$status\
$shell\
$character"""

# Inserts a blank line between shell prompts
add_newline = true

# Timeout for commands executed by starship (in milliseconds)
command_timeout = 10000

# Replace the "❯" symbol in the prompt with "➜"
[character] # The name of the module we are configuring is "character"
success_symbol = "[➜](bold green)" # The "success_symbol" segment is being set to "➜" with the color "bold green"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[aws]
symbol = "  "

[conda]
symbol = " "
format = "[$symbol$environment](dimmed green) "

[dart]
symbol = " "

[directory]
read_only = " "
format = "in [$path]($style)[$read_only]($read_only_style) "

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[git_branch]
symbol = " "

[golang]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_only = false
format = "on [$hostname](bold red) "
disabled = true

[java]
symbol = " "

[julia]
symbol = " "

[localip]
disabled = true

[memory_usage]
symbol = " "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[nodejs]
symbol = " "

#[package]
#symbol = " "

[rust]
symbol = " "

[username]
format = "[$user]($style) "
show_always = true

[custom.hostname-pretty]
command = "hostnamectl --pretty"
when = "hostnamectl --pretty"
style = "bold red"
format = "on [$output]($style) "
ignore_timeout = true
